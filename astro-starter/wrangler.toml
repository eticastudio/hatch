# Cloudflare Workers (Workers Assets) configuration for Hatch.
#
# This file is read by:
#   - The `deploy.workers.cloudflare.com/?url=…` 1-click deploy button
#     (the "Deploy to Cloudflare" button in the Hatch WP plugin wizard)
#   - `wrangler deploy` from a developer's CLI
#
# Why Workers and not Pages: CF Workers has a public 1-click deploy URL pattern
# (deploy.workers.cloudflare.com), which lets users deploy from inside CF's own
# UI — no API token paste, no broker build server in the loop. `astro build`
# (Cloudflare adapter, the default build target) writes dist/client (static
# assets) and dist/server (worker + generated wrangler.json), and leaves
# .wrangler/deploy/config.json so `wrangler deploy` picks them up from here.

name = "hatch-frontend"
# `main` is the adapter's unified entrypoint (Astro 6 / @astrojs/cloudflare v14
# docs, "Changed: Wrangler entrypoint configuration"). It is a package specifier,
# not a build artefact, so it resolves before and after `astro build`.
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2025-09-01"
compatibility_flags = [ "nodejs_compat" ]

# Workers Assets binding — serves static files (CSS, images, _astro/*) at the
# edge, and falls through to the SSR worker for dynamic routes.
[assets]
binding   = "ASSETS"
directory = "./dist"

# Environment variables. Only the non-sensitive WordPress URL is declared here,
# as Cloudflare's Astro docs prescribe. Credentials must never live in this file:
# WP_API_USER, WP_API_PASS and HATCH_WEBHOOK_SECRET are secrets, set with
# `wrangler secret put <NAME>` (or supplied by the Hatch plugin deploy).
# The deploy fills WP_API_URL in for you; never hard-code a site URL here.
[vars]
WP_API_URL = ""
